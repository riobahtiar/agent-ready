# Managed by ~/.dotfiles (nginx/default.conf) → sites-enabled/00-default.conf
# Unknown hosts get nothing: no default page, no cert leak. Port 80 still
# answers ACME challenges so `site add` can issue certs before its vhost exists.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    include snippets/cloud-acme.conf;
    location / { return 444; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
