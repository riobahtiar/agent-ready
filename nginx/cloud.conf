# Managed by ~/.dotfiles (nginx/cloud.conf) → /etc/nginx/conf.d/cloud.conf
# http{}-level additions only. Ubuntu 26.04's nginx.conf already sets sendfile,
# tcp_nopush, types_hash_max_size, server_tokens, ssl_protocols, gzip and
# logging — repeating any of them here fails `nginx -t` ("directive is
# duplicate"). server_tokens is turned off per server in cloud-tls.conf instead.

client_max_body_size 64m;
server_names_hash_bucket_size 128;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml application/rss+xml image/svg+xml font/woff2;

# WebSocket upgrade for proxied apps, dev servers and the Hermes dashboard.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The visitor's scheme at Cloudflare (CF-Visitor header), for X-Forwarded-Proto.
map $http_cf_visitor $cf_scheme {
    default                 $scheme;
    "~\"scheme\":\"https\"" https;
}

# Per-IP request limit used by every generated vhost (burst absorbs page loads).
limit_req_zone $binary_remote_addr zone=cloud_req:10m rate=20r/s;
limit_req_status 429;
