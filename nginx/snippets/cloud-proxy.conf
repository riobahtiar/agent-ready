# Managed by ~/.dotfiles — reverse proxy headers (WebSocket-aware)
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $cf_scheme (cloud.conf): https when Cloudflare served the visitor over HTTPS,
# even if it reached us over HTTP (its "Flexible" mode); otherwise $scheme.
proxy_set_header X-Forwarded-Proto $cf_scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
# Timeouts are set per vhost (templates), not here — nginx rejects duplicates.
