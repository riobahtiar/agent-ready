# site: __DOMAIN__ type=hermes upstream=127.0.0.1:__PORT__
# Generated by stages/80-hermes.sh from ~/.dotfiles/nginx/templates/hermes.conf.
# The dashboard reads/writes ~/.hermes/.env and has a web terminal: it is a
# shell on this box. Hermes' own login is required (dashboard.public_url is
# non-loopback); HERMES_ALLOW_IPS narrows it further.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    include snippets/cloud-acme.conf;
    access_log /var/log/nginx/__DOMAIN__.access.log;
    error_log  /var/log/nginx/__DOMAIN__.error.log;
    client_max_body_size 100m;
__HTTP__
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include snippets/cloud-tls.conf;

    access_log /var/log/nginx/__DOMAIN__.access.log;
    error_log  /var/log/nginx/__DOMAIN__.error.log;

    client_max_body_size 100m;
__ALLOW__
    location / {
        limit_req zone=cloud_req burst=80 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
        include snippets/cloud-proxy.conf;
        # Streamed agent output + embedded terminal: no buffering, long-lived sockets.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
