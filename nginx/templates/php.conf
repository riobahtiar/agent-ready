# site: __DOMAIN__ type=php root=__ROOT__
# Generated by `site add` from ~/.dotfiles/nginx/templates/php.conf — edit the template, then `site add` again.
# Laravel: point --php at the project's public/ directory.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    include snippets/cloud-acme.conf;
    location / {
        # Cloudflare in "Flexible" SSL mode fetches the origin over HTTP even
        # for HTTPS visitors: redirecting would loop forever. Say so instead.
        if ($http_cf_visitor ~ '"scheme":"https"') {
            return 421 "Cloudflare SSL/TLS mode is Flexible. Set it to Full (strict): this server has a valid certificate.\n";
        }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include snippets/cloud-tls.conf;

    access_log /var/log/nginx/__DOMAIN__.access.log;
    error_log  /var/log/nginx/__DOMAIN__.error.log;

    root __ROOT__;
    index index.php index.html;
    charset utf-8;

    location / {
        limit_req zone=cloud_req burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_read_timeout 120s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known) { deny all; }
}
