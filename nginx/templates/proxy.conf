# site: __DOMAIN__ type=proxy upstream=__UPSTREAM__
# Generated by `site add` from ~/.dotfiles/nginx/templates/proxy.conf — edit the template, then `site add` again.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    include snippets/cloud-acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include snippets/cloud-tls.conf;

    access_log /var/log/nginx/__DOMAIN__.access.log;
    error_log  /var/log/nginx/__DOMAIN__.error.log;

    location / {
        limit_req zone=cloud_req burst=60 nodelay;
        proxy_pass http://__UPSTREAM__;
        include snippets/cloud-proxy.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
