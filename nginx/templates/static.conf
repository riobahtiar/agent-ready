# site: __DOMAIN__ type=static root=__ROOT__ spa=__SPA__
# Generated by `site add` from ~/.dotfiles/nginx/templates/static.conf — edit the template, then `site add` again.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    include snippets/cloud-acme.conf;
    location / {
        # Cloudflare in "Flexible" SSL mode fetches the origin over HTTP even
        # for HTTPS visitors: redirecting would loop forever. Say so instead.
        if ($http_cf_visitor ~ '"scheme":"https"') {
            return 421 "Cloudflare SSL/TLS mode is Flexible. Set it to Full (strict): this server has a valid certificate.\n";
        }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include snippets/cloud-tls.conf;

    access_log /var/log/nginx/__DOMAIN__.access.log;
    error_log  /var/log/nginx/__DOMAIN__.error.log;

    root __ROOT__;
    index index.html;

    location / {
        limit_req zone=cloud_req burst=100 nodelay;
        try_files __TRY_FILES__;
    }

    # Fingerprinted build assets (Vite, Next export, Flutter web, …)
    location ~* \.(?:css|js|mjs|woff2?|png|jpe?g|gif|svg|webp|avif|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }
}
