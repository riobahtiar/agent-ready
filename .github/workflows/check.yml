name: Static Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint & Contract Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck, shfmt, and fish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck shfmt fish python3

      - name: Check formatting (shfmt)
        run: |
          shfmt -d -i 4 install.sh bootstrap.sh setup-server.sh setup-desktop.sh lib stages scripts shell bin agents.d tunnels.d

      - name: Run static & contract checks
        run: ./scripts/check.sh
