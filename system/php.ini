; Managed by ~/.dotfiles (system/php.ini) → /etc/php/<ver>/{fpm,cli}/conf.d/90-cloud.ini
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
expose_php = Off
date.timezone = UTC
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
