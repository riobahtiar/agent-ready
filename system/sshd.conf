# Managed by ~/.dotfiles (system/sshd.conf) — rendered by stages/20-security.sh
# "no" only once a key login by this user has been seen (stage 20 checks).
PasswordAuthentication __PASSWORD_AUTH__
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin __ROOT_LOGIN__
PermitEmptyPasswords no
# OpenSSH's default. Lower values refuse people whose ssh-agent offers a few
# keys before the right one, and fail2ban then bans them.
MaxAuthTries 6
LoginGraceTime 30
X11Forwarding no
# Keep long agent sessions alive through NAT; drop dead clients after ~3 min.
ClientAliveInterval 60
ClientAliveCountMax 3
# Lets you forward your laptop's ssh-agent for git push (`ssh -A`).
AllowAgentForwarding yes
AllowTcpForwarding yes
