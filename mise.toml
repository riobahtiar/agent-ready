# Tools + tasks for working on this repo (laptop or VPS): `mise run check`.
[tools]
shellcheck = "latest"
shfmt = "latest"

[tasks.check]
description = "bash -n, shellcheck, fish -n, stage headers, templates, secrets"
run = "./scripts/check.sh"

[tasks.fmt]
description = "shfmt all shell scripts (4-space indent, case labels not indented — the repo style)"
run = "shfmt -w -i 4 install.sh bootstrap.sh lib stages scripts shell bin agents.d tunnels.d"
