# Tools + tasks for working on AgentReady (laptop or VPS): `mise run check`.
[tools]
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.check]
description = "bash -n, shellcheck, fish -n, stage headers, module contracts, templates, secrets"
run = "./scripts/check.sh"

[tasks.fmt]
description = "shfmt all shell scripts (4-space indent, case labels not indented — the repo style)"
run = "shfmt -w -i 4 install.sh bootstrap.sh setup-server.sh setup-desktop.sh lib stages scripts shell bin agents.d tunnels.d"
